name: Build cloud function packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source bundle
        id: source
        shell: bash
        run: |
          if [ -s source-bundle.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::source-bundle.zip is not uploaded yet; build will be skipped."
          fi

      - name: Prepare source
        if: steps.source.outputs.present == 'true'
        run: |
          mkdir -p work
          unzip -q source-bundle.zip -d work

      - name: Include per-game check-in results in HoYoLAB LTS logs
        if: steps.source.outputs.present == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("work/hoyolab/index.py")
          source = path.read_text(encoding="utf-8")
          helper = '''def _emit_checkin_result_logs(message):
              """Write returned per-game results to stdout so FunctionGraph forwards them to LTS."""
              game_names = ("崩坏学园2", "崩坏3rd", "未定事件簿", "原神", "崩坏：星穹铁道", "绝区零")
              current_game = "其他"
              for raw_line in str(message or "").splitlines():
                  line = raw_line.strip()
                  if not line:
                      continue
                  # Ignore empty game section headers such as "绝区零：" or "绝区零:".
                  # They are formatting artifacts, not check-in results.
                  empty_header = False
                  for name in game_names:
                      if line == name + "：" or line == name + ":":
                          current_game = name
                          empty_header = True
                          break
                      if line.startswith(name + "：") or line.startswith(name + ":"):
                          current_game = name
                          break
                  if empty_header:
                      continue
                  print("[签到结果][{}] {}".format(current_game, line), flush=True)


          '''
          if "def _emit_checkin_result_logs(message):" not in source:
              source = source.replace("def main_handler(event: dict, context: dict):", helper + "def main_handler(event: dict, context: dict):", 1)
          call = "    _emit_checkin_result_logs(push_message)\n    push.push(status_code, push_message)"
          if call not in source:
              if "    push.push(status_code, push_message)" not in source:
                  raise SystemExit("HoYoLAB main_handler result/push call not found; refusing to build without result logging")
              source = source.replace("    push.push(status_code, push_message)", call, 1)
          path.write_text(source, encoding="utf-8")
          if "[签到结果][绝区零]" not in source and "_emit_checkin_result_logs" not in source:
              raise SystemExit("HoYoLAB result logger patch verification failed")
          print("HoYoLAB returned check-in results will be emitted as game-tagged LTS log lines.")
          PY

      - name: Set up Python
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inspect HoYoLAB deployment entry
        if: steps.source.outputs.present == 'true'
        run: |
          echo "===== HoYoLAB source files ====="
          find work/hoyolab -maxdepth 3 -type f -printf '%P\n' | sort
          echo "===== Python entry functions ====="
          grep -R -n -E '^def (handler|main|run)\\(' work/hoyolab --include='*.py' || true
          echo "===== Entry module tails ====="
          for f in work/hoyolab/*.py; do
            echo "--- $f"
            tail -35 "$f"
          done

      - name: Build HoYoLAB package
        if: steps.source.outputs.present == 'true'
        run: |
          set -euxo pipefail
          mkdir -p dist/hoyolab/package/config
          python -m pip install --upgrade pip
          python -m pip install -r work/hoyolab/requirements.txt -t dist/hoyolab/package
          cp work/hoyolab/*.py dist/hoyolab/package/
          cp work/hoyolab/config/*.example dist/hoyolab/package/config/
          cp work/hoyolab/config/config.yaml.example dist/hoyolab/package/config/config.yaml
          cd dist/hoyolab/package
          zip -qr ../../../hoyolab.zip .

      - name: Inspect Skland token path and execution result handling
        if: steps.source.outputs.present == 'true'
        run: |
          echo "===== Skland source files ====="
          find work/skland -maxdepth 4 -type f -printf '%P\n' | sort
          echo "===== Token file references ====="
          grep -R -n -i -E 'token[.]txt|INPUT_HYPERGRYPH_TOKEN|token' work/skland/src --include='*.py' || true
          echo "===== Skland entry source ====="
          sed -n '1,120p' work/skland/src/index.py
          echo "===== Token loading implementation ====="
          grep -n -B 8 -A 15 -i -E 'token|open|read_text' work/skland/src/skyland.py || true
          echo "===== Handler and exception handling ====="
          grep -R -n -E '^def handler|except Exception|raise |return ' work/skland/src --include='*.py' || true

      - name: Build Skland Huawei FunctionGraph Python 3.10 package
        if: steps.source.outputs.present == 'true'
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p dist/skland/code
          python -m pip install --no-compile -r work/skland/requirements.txt -t dist/skland
          cp -a work/skland/src/. dist/skland/
          # Apply per-account game selection inside the platform's own signing adapter.
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/skland/skyland.py")
          s = p.read_text(encoding="utf-8")
          old_signature = "def do_sign(cred_resp):"
          new_signature = "def do_sign(cred_resp, enabled_games=None):"
          if new_signature not in s:
              if old_signature not in s:
                  raise SystemExit("Skland do_sign signature not found; refusing to build")
              s = s.replace(old_signature, new_signature, 1)
          old_block = "    characters = get_binding_list()\n    success = True"
          new_block = (
              "    characters = get_binding_list()\n"
              "    if enabled_games is not None:\n"
              "        enabled_games = set(enabled_games)\n"
              "        characters = [item for item in characters if item.get('appCode') in enabled_games]\n"
              "    success = True"
          )
          if new_block not in s:
              if old_block not in s:
                  raise SystemExit("Skland character selection block not found; refusing to build")
              s = s.replace(old_block, new_block, 1)
          p.write_text(s, encoding="utf-8")
          if new_signature not in s or "item.get('appCode') in enabled_games" not in s:
              raise SystemExit("Skland per-game filter verification failed")
          print("Skland signing now filters characters by each account's enabled games.")
          PY
          # Keep account loading separate from the platform's signing implementation.
          cat > dist/skland/skland_entry.py <<'PY'
          import hashlib
          import json
          import logging
          import os

          import skyland

          ROOT = os.path.dirname(os.path.abspath(__file__))
          file_save_token = os.path.join(ROOT, "code", "INPUT_HYPERGRYPH_TOKEN.txt")
          account_config_path = os.path.join(ROOT, "code", "INPUT_HYPERGRYPH_ACCOUNTS.json")
          SUPPORTED_GAMES = {"arknights", "endfield"}

          logging.getLogger().setLevel(logging.INFO)


          def _stable_id(token):
              return hashlib.sha256(token.encode("utf-8")).hexdigest()


          def _read_legacy_tokens():
              if not os.path.exists(file_save_token):
                  return []
              result = []
              with open(file_save_token, "r", encoding="utf-8") as source:
                  for raw in source:
                      token = raw.strip()
                      if token and not token.startswith("#") and token not in result:
                          result.append(token)
              return result


          def load_accounts():
              if os.path.exists(account_config_path):
                  with open(account_config_path, "r", encoding="utf-8") as source:
                      raw = source.read().strip()
                  if raw:
                      document = json.loads(raw)
                      if document.get("version") != 1 or not isinstance(document.get("accounts"), list):
                          raise ValueError("森空岛账号配置格式不受支持")
                      accounts = []
                      seen_tokens = set()
                      seen_ids = set()
                      for item in document["accounts"]:
                          if not isinstance(item, dict):
                              raise ValueError("森空岛账号配置包含无效条目")
                          token = str(item.get("token") or "").strip()
                          games = item.get("games")
                          if not token or not isinstance(games, list):
                              raise ValueError("森空岛账号缺少 Token 或游戏列表")
                          selected = sorted(set(games))
                          if not selected or not set(selected).issubset(SUPPORTED_GAMES):
                              raise ValueError("森空岛账号游戏选择为空或包含不支持的游戏")
                          stable_id = str(item.get("platformUserId") or _stable_id(token))
                          if token in seen_tokens or stable_id in seen_ids:
                              raise ValueError("森空岛账号配置存在重复账号")
                          seen_tokens.add(token)
                          seen_ids.add(stable_id)
                          accounts.append({"platformUserId": stable_id, "token": token, "games": selected})
                      return accounts

              # Legacy token files had no game-selection field. Preserve their old all-games behavior.
              return [
                  {"platformUserId": _stable_id(token), "token": token, "games": sorted(SUPPORTED_GAMES)}
                  for token in _read_legacy_tokens()
              ]


          def start(token, games):
              try:
                  cred = skyland.get_cred_by_token(token)
                  success, messages = skyland.do_sign(cred, enabled_games=games)
                  for message in messages or []:
                      logging.info("[签到结果] %s", message)
                  if not success:
                      raise RuntimeError("森空岛签到执行返回失败")
              except Exception as ex:
                  logging.exception("森空岛签到执行失败")
                  raise RuntimeError("森空岛签到执行失败：" + str(ex)) from ex


          def handler():
              accounts = load_accounts()
              if not accounts:
                  raise RuntimeError("森空岛账号配置为空")
              for account in accounts:
                  start(account["token"], account["games"])


          PY
          cat > dist/skland/index.py <<'PY'
          """Huawei FunctionGraph Python 3.10 handler."""
          from skland_entry import handler as run_skland

          def handler(event, context):
              run_skland()
              return {"statusCode": 200, "body": "Skland task finished"}
          PY
          touch dist/skland/code/INPUT_HYPERGRYPH_TOKEN.txt
          printf '{"version":1,"accounts":[]}\n' > dist/skland/code/INPUT_HYPERGRYPH_ACCOUNTS.json
          cat > dist/skland/DEPLOY.txt <<'TXT'
          Huawei FunctionGraph runtime: Python 3.10
          Handler: index.handler
          This package is for the built-in Python runtime, not Custom Runtime.
          Account config: ./code/INPUT_HYPERGRYPH_ACCOUNTS.json
          Legacy Token file retained: ./code/INPUT_HYPERGRYPH_TOKEN.txt
          TXT
          # Test structured per-account games, legacy compatibility and fail-closed empty configuration.
          (cd dist/skland && python - <<'PY'
          import json
          import os
          import skland_entry as index
          assert os.path.isfile(index.file_save_token), index.file_save_token
          assert os.path.isfile(index.account_config_path), index.account_config_path

          with open(index.account_config_path, "w", encoding="utf-8") as config_file:
              json.dump({"version": 1, "accounts": [
                  {"platformUserId": "account-a", "token": "unit-test-token", "games": ["endfield"]}
              ]}, config_file)
          accounts = index.load_accounts()
          assert len(accounts) == 1 and accounts[0]["games"] == ["endfield"], accounts

          os.remove(index.account_config_path)
          with open(index.file_save_token, "w", encoding="utf-8") as token_file:
              token_file.write("legacy-token\n")
          legacy = index.load_accounts()
          assert len(legacy) == 1 and set(legacy[0]["games"]) == index.SUPPORTED_GAMES, legacy

          with open(index.account_config_path, "w", encoding="utf-8") as config_file:
              config_file.write('{"version":1,"accounts":[]}')
          with open(index.file_save_token, "w", encoding="utf-8") as token_file:
              token_file.write("")
          try:
              index.handler()
          except RuntimeError as exc:
              assert "账号配置为空" in str(exc), str(exc)
              print("Skland structured config, legacy compatibility and empty-config guard passed.")
          else:
              raise AssertionError("Empty account configuration unexpectedly reported success")
          PY
          )
          find dist/skland -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist/skland -type d \( -name tests -o -name test \) -prune -exec rm -rf {} +
          find dist/skland -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          echo "Uncompressed Skland Python package size:"
          du -sh dist/skland
          cd dist/skland
          zip -9 -qr "$GITHUB_WORKSPACE/skland.zip" .
          echo "Compressed Skland Python ZIP size:"
          ls -lh "$GITHUB_WORKSPACE/skland.zip"

      - name: Verify packages
        if: steps.source.outputs.present == 'true'
        run: |
          unzip -l hoyolab.zip | head -40
          unzip -l skland.zip | head -40
          test -s hoyolab.zip
          test -s skland.zip

      - name: Upload build artifacts
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-function-packages
          path: |
            hoyolab.zip
            skland.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned release assets
        if: steps.source.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloud-functions-${{ github.run_number }}-${{ github.sha }}
          name: Cloud functions build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            hoyolab.zip
            skland.zip
