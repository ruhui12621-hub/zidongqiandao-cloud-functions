name: Build cloud function packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source bundle
        id: source
        shell: bash
        run: |
          if [ -s source-bundle.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::source-bundle.zip is not uploaded yet; build will be skipped."
          fi

      - name: Prepare source
        if: steps.source.outputs.present == 'true'
        run: |
          mkdir -p work
          unzip -q source-bundle.zip -d work

      - name: Set up Python
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build HoYoLAB package
        if: steps.source.outputs.present == 'true'
        run: |
          set -euxo pipefail
          mkdir -p dist/hoyolab/package/config
          python -m pip install --upgrade pip
          python -m pip install -r work/hoyolab/requirements.txt -t dist/hoyolab/package
          cp work/hoyolab/*.py dist/hoyolab/package/
          cp work/hoyolab/config/*.example dist/hoyolab/package/config/
          cp work/hoyolab/config/config.yaml.example dist/hoyolab/package/config/config.yaml
          cd dist/hoyolab/package
          zip -qr ../../../hoyolab.zip .

      - name: Build Skland Huawei FunctionGraph package (optimized PyInstaller)
        if: steps.source.outputs.present == 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          upx --version
          python -m pip install --upgrade pip
          python -m pip install -r work/skland/requirements.txt pyinstaller
          cd work/skland
          mkdir -p dist/cloud_functions
          pyinstaller --noconfirm --clean --onedir --strip --name index \
            --distpath "$PWD/dist/cloud_functions" \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module doctest \
            --exclude-module pydoc \
            --exclude-module pydoc_data \
            --exclude-module lib2to3 \
            --exclude-module idlelib \
            --exclude-module turtle \
            --exclude-module test \
            --exclude-module ensurepip \
            --exclude-module venv \
            src/index.py
          touch dist/cloud_functions/INPUT_HYPERGRYPH_TOKEN.txt
          install -m 755 .build/bootstrap dist/cloud_functions/bootstrap
          # Smoke test: run the exact packaged executable with an empty token file.
          mkdir -p dist/cloud_functions/code
          touch dist/cloud_functions/code/INPUT_HYPERGRYPH_TOKEN.txt
          (cd dist/cloud_functions && ./index/index)
          rm -rf dist/cloud_functions/code
          echo "Uncompressed Skland package size:"
          du -sh dist/cloud_functions
          cd dist/cloud_functions
          zip -9 -qr "$GITHUB_WORKSPACE/skland.zip" .
          echo "Compressed Skland ZIP size:"
          ls -lh "$GITHUB_WORKSPACE/skland.zip"

      - name: Verify packages
        if: steps.source.outputs.present == 'true'
        run: |
          unzip -l hoyolab.zip | head -40
          unzip -l skland.zip | head -40
          test -s hoyolab.zip
          test -s skland.zip

      - name: Upload build artifacts
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-function-packages
          path: |
            hoyolab.zip
            skland.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned release assets
        if: steps.source.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloud-functions-${{ github.run_number }}-${{ github.sha }}
          name: Cloud functions build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            hoyolab.zip
            skland.zip
