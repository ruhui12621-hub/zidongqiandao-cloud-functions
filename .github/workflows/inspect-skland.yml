name: Inspect Skland package sources
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          unzip -q source-bundle.zip -d work
          echo '===== requirements.txt ====='
          cat work/skland/requirements.txt
          echo '===== build script ====='
          cat work/skland/.build/build_cloud_function.sh
          echo '===== bootstrap ====='
          cat work/skland/.build/bootstrap
          echo '===== index.py ====='
          sed -n '1,260p' work/skland/src/index.py
          echo '===== main.py ====='
          sed -n '1,300p' work/skland/src/main.py
          echo '===== source tree ====='
          find work/skland -maxdepth 4 -type f -printf '%P %s bytes\n' | sort
